<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:364px;font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
  color:#0f172a;background:#ffffff;user-select:none;
}
.head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid #eef2f7}
.logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.t{flex:1}
.t .n{font-size:14px;font-weight:700;letter-spacing:.04em}
.t .s{font-size:10.5px;color:#94a3b8;letter-spacing:.1em;margin-top:2px}
.cur{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #eef2f7}
.cur .lb{font-size:10.5px;color:#94a3b8;letter-spacing:.14em}
.cur .chip{display:flex;align-items:center;gap:6px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:5px 10px;font-size:12px;color:#1d4ed8}
.cur .chip .m{font-size:9.5px;color:#2563eb;background:#dbeafe;border-radius:4px;padding:1px 5px}
.cur .price{margin-left:auto;font-family:'DIN Alternate','Bahnschrift Condensed',sans-serif;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cur .price.up{color:#e5484d}.cur .price.down{color:#10a37f}
.prdline{padding:6px 16px;border-bottom:1px solid #eef2f7;font-size:10.5px;color:#64748b;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prdline b{font-family:'DIN Alternate','Bahnschrift Condensed',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.sect{padding:10px 16px 4px;display:flex;align-items:center;justify-content:space-between}
.sect .t{font-size:11px;font-weight:600;color:#334155;letter-spacing:.1em}
.sect .cnt{font-size:10px;color:#94a3b8}
.mylist{max-height:196px;overflow-y:auto;padding:2px 10px 6px}
.mylist::-webkit-scrollbar{width:5px}
.mylist::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.mrow{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;transition:background .15s,border-color .15s;
}
.mrow:hover{background:#f8fafc;border-color:#e2e8f0}
.mrow.on{background:#eff6ff;border-color:#bfdbfe}
.mrow .mk{font-size:9.5px;color:#2563eb;border:1px solid #bfdbfe;border-radius:4px;padding:1px 5px;flex-shrink:0;background:#fff}
.mrow .nm{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#0f172a}
.mrow .cd{font-family:'DIN Alternate',monospace;font-size:10.5px;color:#94a3b8;flex-shrink:0}
.mrow .act{font-size:9.5px;color:#2563eb;flex-shrink:0;font-weight:600}
.mrow .del{
  flex-shrink:0;width:20px;height:20px;border-radius:6px;border:none;background:transparent;color:#cbd5e1;
  font-size:13px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;
}
.mrow:hover .del{display:flex}
.mrow .del:hover{color:#e5484d;background:#fef2f2}
.emp{padding:20px 0;text-align:center;font-size:11.5px;color:#94a3b8}
.seek{padding:8px 16px 4px}
.seek input{
  width:100%;padding:9px 12px;border-radius:9px;outline:none;font-size:13px;color:#0f172a;
  background:#f8fafc;border:1px solid #e2e8f0;transition:border-color .2s,box-shadow .2s;
  font-family:inherit;
}
.seek input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12);background:#fff}
.seek .tip{font-size:10px;color:#94a3b8;margin-top:6px}
.list{max-height:220px;overflow-y:auto;padding:2px 10px 8px}
.list::-webkit-scrollbar{width:5px}
.list::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;transition:background .15s,border-color .15s;
}
.item:hover{background:#f8fafc;border-color:#e2e8f0}
.item .mk{font-size:9.5px;color:#2563eb;border:1px solid #bfdbfe;border-radius:4px;padding:1px 5px;flex-shrink:0}
.item .nm{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cd{font-family:'DIN Alternate',monospace;font-size:10.5px;color:#94a3b8;flex-shrink:0}
.item .tp{font-size:9.5px;color:#64748b;border:1px solid #e2e8f0;border-radius:4px;padding:1px 5px;flex-shrink:0}
.item .add{font-size:9.5px;color:#2563eb;font-weight:600;flex-shrink:0}
.foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;border-top:1px solid #eef2f7}
.foot .ok{font-size:11px;color:#10a37f;letter-spacing:.06em;opacity:0;transition:opacity .3s}
.foot .ok.show{opacity:1}
.foot a{font-size:11px;color:#2563eb;text-decoration:none;letter-spacing:.06em;cursor:pointer}
.foot a:hover{color:#1d4ed8}
.visbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;border-bottom:1px solid #eef2f7}
.visbar .t{font-size:11.5px;color:#334155;font-weight:600;letter-spacing:.04em}
.visbar .st{font-size:9.5px;color:#94a3b8;margin-top:1px}
.switch{position:relative;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:99px;background:#cbd5e1;transition:background .2s;cursor:pointer}
.slider::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;left:3px;top:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(15,23,42,.28)}
.switch input:checked + .slider{background:#2563eb}
.switch input:checked + .slider::before{transform:translateX(18px)}
</style>
</head>
<body>
  <div class="head">
    <div class="logo">行情</div>
    <div class="t">
      <div class="n">实时股价</div>
      <div class="s">全局悬浮 · 多股票 · 实时行情</div>
    </div>
  </div>

  <div class="cur">
    <span class="lb">当前</span>
    <span class="chip"><span class="m" id="curMk">--</span><span id="curName">--</span><span id="curCode" style="color:#94a3b8;font-size:10.5px">--</span></span>
    <span class="price" id="curPrice">--</span>
  </div>
  <div class="prdline" id="prdline">预测参考：--</div>

  <div class="visbar">
    <div>
      <div class="t">页面悬浮球</div>
      <div class="st" id="visSt">--</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="visToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="sect">
    <span class="t">已配置股票</span>
    <span class="cnt" id="cnt">0 只</span>
  </div>
  <div class="mylist" id="mylist">
    <div class="emp" id="myEmp">尚未配置股票，请在下方搜索添加</div>
  </div>

  <div class="seek">
    <input id="kw" type="text" placeholder="搜索添加股票，如：茅台、002895、hk00700" autocomplete="off">
    <div class="tip">点击候选即加入列表；点击列表项切换展示</div>
  </div>
  <div class="list" id="list"></div>

  <div class="foot">
    <span class="ok" id="ok">已保存 ✓</span>
    <a id="openOpts">打开完整设置 →</a>
  </div>

<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
